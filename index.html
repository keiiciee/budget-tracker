<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Budget Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💜 My Budget Tracker</h1>
        <p class="subtitle">Keep track of your money</p>

        <div class="balance-card">
            <p>Remaining Balance</p>
            <h2 id="balance">₱0.00</h2>
        </div>

        <div class="card">
            <h2>💰 Starting Budget</h2>

            <input
                type="number"
                id="startingBudget"
                placeholder="Enter your budget"
            >

            <button onclick="setBudget()">Set Budget</button>
        </div>

        <div class="card">
            <h2>💵 Add Income</h2>

            <input
                type="text"
                id="incomeName"
                placeholder="Where did it come from?"
            >

            <input
                type="number"
                id="incomeAmount"
                placeholder="Amount"
            >

            <button onclick="addIncome()"> Add Income</button>
        </div>

        <div class="card">
            <h2>🛍️ Add Expense</h2>

            <input
                type="text"
                id="expenseName"
                placeholder="What did you buy?"
            >

            <input
                type="number"
                id="expenseAmount"
                placeholder="Amount"
            >

            <button onclick="addExpense()"> Add Expense</button>
        </div>

        <div class="summary-card">

            <div>
                <p>💵 Total Income</p>
                <h3 id="totalIncome">₱0.00</h3>
            </div>

            <div>
                <p>🛍️ Total Expenses</p>
                <h3 id="totalExpenses">₱0.00</h3>
            </div>

        </div>

        <div class="card">

            <h2>🧾 My Expenses</h2>

            <div id="expenseList">
                <p class="empty">No expenses yet 💜</p>
            </div>

        </div>
